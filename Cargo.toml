[package]
name = "forkpkg"
version = "0.1.0"
edition = "2024"
description = "Create editable local source forks of Nix packages"
license = "MIT"
repository = "https://github.com/rndhouse/forkpkg"
readme = "README.md"
keywords = ["nix", "nixos", "git", "patch", "fork"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["AGENTS.md", "assets/forkpkg-logo.png"]

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
tempfile = "3"
toml = "0.9"
